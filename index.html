<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MotoParts Catalog & Sheet Sync</title>
    <meta name="description" content="Searchable motorcycle parts pricelist with live categories, stock status, and real-time Google Sheets database sync." />
    <meta property="og:title" content="MotoParts Catalog & Sheet Sync" />
    <meta property="og:description" content="Searchable motorcycle parts pricelist with live categories, stock status, and real-time Google Sheets database sync." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;text-align:center;">
        <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(245,158,11,0.5);">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18.5" cy="17.5" r="3.5"/>
            <circle cx="5.5" cy="17.5" r="3.5"/>
            <circle cx="15" cy="5" r="1"/>
            <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
          </svg>
        </div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#f8fafc;margin-bottom:6px;">MotoParts Pricelist</div>
        <div style="font-size:13px;color:#94a3b8;margin-bottom:24px;">Loading catalog & local database...</div>
        <div style="width:36px;height:36px;border:3px solid #334155;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.innerHTML.indexOf('MotoParts Pricelist') !== -1 && root.innerHTML.indexOf('Loading') !== -1) {
          root.innerHTML = '<div style="min-height:100vh;background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:32px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">' +
            '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="font-size:20px;font-weight:700;margin-bottom:8px;color:#f87171;">Failed to initialize MotoParts</h2>' +
            '<p style="font-size:13px;color:#94a3b8;max-width:320px;margin-bottom:20px;word-break:break-word;">' + (e.message || 'Unknown initialization error') + '</p>' +
            '<button onclick="location.reload()" style="background:#f59e0b;color:#000;border:none;padding:10px 24px;border-radius:10px;font-weight:700;cursor:pointer;">Retry</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
